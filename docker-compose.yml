services:
  # ─── SQL Server ───
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: laundrypos-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── MQTT Broker (Mosquitto) ───
  mqtt:
    image: eclipse-mosquitto:2
    container_name: laundrypos-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # ─── API Backend ───
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: laundrypos-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LaundryPOS;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=LaundryPOS
      - Jwt__Audience=LaundryPOS.Client
      - IoT__Mqtt__BrokerHost=mqtt
      - IoT__Mqtt__BrokerPort=1883
      # Real host path of the repo, needed because the sibling updater
      # container is created by the HOST docker daemon (Docker-outside-of-
      # Docker): bind-mount paths must be host paths, not paths as seen
      # from inside this container (which sees the repo as /workspace).
      - HOST_REPO_PATH=${PWD}
    ports:
      - "5002:80"
    volumes:
      # Mounted so the API can trigger the manual self-update flow
      # (git fetch/checkout + docker compose rebuild) via SystemController.
      # SECURITY NOTE: this gives the api container root-equivalent control
      # over the Docker host. Only Administrator-authenticated endpoints use it.
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    depends_on:
      sqlserver:
        condition: service_healthy
      mqtt:
        condition: service_started

  # ─── Frontend ───
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: laundrypos-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  mosquitto-data:
  mosquitto-log:
